# Our Little Tide — Cloudflare Worker (khaledapp) + static assets
# Aligns with Workers Builds (assets directory + empty [previews] for wrangler preview).
# Do not commit secret values; set them with `wrangler secret put` / dashboard.

name = "khaledapp"
main = "src/worker.js"
compatibility_date = "2026-11-19"

[assets]
directory = "./public"
binding = "ASSETS"
# Prefer /login over /login.html so auth redirects do not fight Assets' .html → extensionless 307s
html_handling = "drop-trailing-slash"
# Worker runs first so auth can gate HTML and handle /api/*
run_worker_first = true

# Required by Workers Builds PR checks (`wrangler preview`)
[previews]

[[d1_databases]]
binding = "DB"
database_name = "khaledapp-auth"
database_id = "b0fff67c-5494-4e6c-943b-ab6f72d637c1"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "AUTH_KV"
id = "5bfc60a20edd4bbc869710eb6fbd8a0c"

[vars]
AUTH_DEV_MODE = "false"
# EMAIL_FROM = "Our Little Tide <login@your-domain.com>"
